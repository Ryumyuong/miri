:root {
  --background: #eef1f6;
  --foreground: #1e293b;
  --brand-navy: #113667;
  --brand-navy-dark: #1a2f4d;
  --brand-blue: #1d4ed8;
  --brand-gold: #c9a24b;
  --hero-photo: url("/hero.png");
  --font-base: clamp(8.2px, 0.77vw, 14.784px);
}
@media (max-width: 990px) {
  :root {
    --font-base: min(2.3983vw, 14.39px);
  }
}
@media (max-width: 500px) {
  :root {
    --font-base: 2.9126vw;
  }
}
html {
  font-size: 20px;
}
body {
  background: var(--background);
  color: var(--foreground);
  font-family: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
}
button:not(:disabled),
[role="button"],
label[for],
summary {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
@media print {
  @page {
    margin: 0;
  }
  body > *:not(.print-portal) {
    display: none !important;
  }
  .print-portal {
    position: static !important;
    display: block !important;
    inset: auto !important;
    z-index: auto !important;
    background: none !important;
    padding: 0 !important;
    overflow: visible !important;
  }
  .print-portal > div {
    max-width: none !important;
    max-height: none !important;
    overflow: visible !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    display: block !important;
  }
  #print-area {
    position: static !important;
    width: 100% !important;
    max-width: none !important;
    height: auto !important;
    max-height: none !important;
    overflow: visible !important;
    margin: 0 !important;
    padding: 12mm 10mm !important;
  }
  .no-print {
    display: none !important;
  }
}
.print-compact,
.print-compact * {
  font-size: 13px !important;
  line-height: 1.6 !important;
}
